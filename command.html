<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Command</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --txt:#e8edf3; --dim:#93a1b1; --faint:#5d6b7a;
    --red:#e0362c; --amber:#e0a52c; --green:#3aa85f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  /* ---------- screen flip (entry from / return to index.html) ---------- */
  /* perspective() lives INSIDE the transform, not as a `perspective`
     property on <html>. On an ancestor it makes position:fixed resolve
     against that ancestor rather than the viewport, which pushed the
     bottom sheet below the fold — the backdrop dimmed the screen but the
     PAR / mode / assign options were parked at the bottom of the
     document. Scoped to .flip-* so it only exists mid-animation, when no
     sheet is open. See the matching block in index.html. */
  body.flip-out{animation:pflipOut .34s cubic-bezier(.4,0,.2,1) forwards;
                height:100vh;overflow:hidden;backface-visibility:hidden}
  body.flip-in{animation:pflipIn .34s cubic-bezier(.4,0,.2,1);
               height:100vh;overflow:hidden;backface-visibility:hidden}
  @keyframes pflipOut{from{transform:perspective(1100px) rotateY(0)}
                        to{transform:perspective(1100px) rotateY(-90deg)}}
  @keyframes pflipIn{from{transform:perspective(1100px) rotateY(90deg)}
                       to{transform:perspective(1100px) rotateY(0)}}

  .bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
       padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
  .bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .bar a{color:var(--dim);text-decoration:none;font-size:14px;flex:0 0 auto}
  .bar h1{font-size:16px;font-weight:700;margin:0;flex:1}
  /* Occupancy (incident type) in the header, bold and prominent. */
  .bar .occ{font-size:14px;font-weight:800;color:var(--txt);flex:1;white-space:nowrap}
  /* Elapsed time, small and muted. */
  .bar .elapsed{font-size:12px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;
                flex:0 0 auto;letter-spacing:.4px}
  /* PAR timer button — critical and always visible. The color-coding happens
     via JavaScript setting --par-color as CSS variable for white→red gradient. */
  .par-timer{flex:0 0 auto;padding:8px 12px;font-size:13px;font-weight:800;
             letter-spacing:.5px;text-transform:uppercase;border-radius:8px;
             background:var(--par-color, var(--txt));color:var(--bg);border:0;
             cursor:pointer;min-height:auto;font-family:inherit;
             transition:background-color 100ms;min-width:80px;text-align:center}
  .par-timer:active{opacity:.85}
  .infobtn{display:none}

  h2{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
     margin:22px 0 9px;font-weight:700}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card + .card{margin-top:10px}

  label{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;
        color:var(--faint);font-weight:700;margin:0 0 7px}
  .field + .field{margin-top:16px}

  textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px 13px;font-size:12.5px;line-height:1.55;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    min-height:180px;resize:vertical;-webkit-appearance:none;appearance:none;
  }
  .export-status{font-size:13px;color:var(--green);margin-top:8px;min-height:16px}

  select, input[type=text]{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px 13px;font-size:15.5px;font-family:inherit;
    min-height:48px;-webkit-appearance:none;appearance:none;
  }
  select{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%2393a1b1"><path d="M5 7l5 6 5-6z"/></svg>');
    background-repeat:no-repeat;background-position:right 13px center;padding-right:36px;
  }

  button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
         border-radius:10px;padding:13px 18px;font-size:15.5px;font-weight:700;
         font-family:inherit;cursor:pointer;min-height:48px}
  button:active{background:var(--line)}
  .primary{background:var(--green);border-color:var(--green);color:#08130c;width:100%}
  .danger{background:transparent;border-color:var(--red);color:var(--red)}
  .btnrow{display:flex;gap:9px;margin-top:14px}
  .btnrow button{flex:1}


  /* clocks — always derived from stored timestamps, never a counter;
     see the correctness rule in COMMAND-MODULE-PLAN.md */
  .clocks{display:flex;gap:20px;margin-top:14px}
  .clock{flex:1}
  .clabel{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
          color:var(--faint);font-weight:700}
  .cval{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .cval.overdue{color:var(--red)}

  .parrow{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .parrow .cval{font-size:22px}
  #btn-par{padding:15px 30px;background:var(--panel2)}
  #btn-par:active{background:var(--line)}

  .flag.urgent{background:#2c1414;border-color:#5c2020;color:#f0a8a0}
  .flag.urgent b{color:#fff}

  /* PAR due + the "consider a PAR" recommendation, side by side in
     one row rather than stacked full-width bars — same reserved-space
     idea as before (visibility, not display, toggles each box) but
     now split so both fit in the space PAR due alone used to take. */
  /* The boxes render inside #par-banner/#par-suggestion, which are the
     ACTUAL flex children of .par-row — flex:1 belongs on them, not just
     the box inside. Without it, each wrapper sizes to its own content
     (a short one-line suggestion vs. a longer PAR-due sentence), so the
     "even split" would drift depending on what's currently showing.
     display:flex + height:100% on the box makes it fill that wrapper's
     stretched height too, so the two boxes always match each other. */
  .par-row{display:flex;gap:10px;margin-top:14px}
  #par-banner, #par-suggestion{flex:1;min-width:0;display:flex}
  .par-due-box, .par-suggest-box{flex:1;min-width:0;height:100%;border-radius:10px;padding:10px 12px;
                                  display:flex;align-items:center;font-size:13px}
  .par-due-box--hidden, .par-suggest-box--hidden{visibility:hidden}
  /* Bold, high-visibility: same red as the PAR timer's overdue stage,
     white text, no mistaking it. Triangles pinned to both edges via
     space-between, vertically centered. The sentence is forced onto
     two explicit lines ("PAR OVERDUE." / "X minutes ago.") rather than
     left to wrap wherever the text happens to break. */
  .par-due-box{justify-content:space-between;gap:6px;background:var(--red);
               border:1px solid var(--red);font-weight:700;color:#fff}
  .par-due-box .par-due-text{flex:1;display:flex;flex-direction:column;align-items:center;
                              justify-content:center;text-align:center}
  .par-due-box .par-overdue-label{font-size:16px}
  .par-due-box .par-due-line2{font-size:13px;margin-top:2px}
  /* Subtler and yellow, text only — no triangles. Same two-explicit-
     lines treatment: "Consider PAR" / the reason, reason sized down
     since it's the longer of the two ("Fire declared under control."
     etc.) and needs to fit one line at half the row's width. */
  .par-suggest-box{flex-direction:column;justify-content:center;text-align:center;
                    background:rgba(224,165,44,.14);border:1px solid rgba(224,165,44,.4);
                    color:#f0d798}
  .par-suggest-box b{color:#f5df9e;font-size:13px}
  .par-suggest-box .par-suggest-line2{font-size:11px;margin-top:2px}

  /* checklist — a grid of real buttons, not a checkbox list (part of
     the shift to an all-button, touchscreen-forward layout). No
     horizontal scroll on phone, ever — auto-fill/minmax gives every
     button the same width (a middle ground between "RIT" and "Fire
     Under Control"), wrapping to as many rows as it takes rather than
     scrolling sideways. Longer labels wrap to a second line inside
     their own button instead of forcing it wider. Desktop/large-screen
     may want a different treatment later; not addressed yet. */
  .ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .ck-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
           background:var(--panel2);border:1px solid var(--line);border-radius:10px;
           padding:8px 8px;min-height:68px;font-family:inherit;text-align:center;
           cursor:pointer}
  .ck-item:active{background:var(--line)}
  .ck-item .lb{font-size:13.5px;font-weight:700;color:var(--txt);line-height:1.25}
  /* Done: a toggle, not a one-way mark — tapping a completed item
     again reopens it (label swaps back, tap to mark done again). The
     button stays genuinely clickable in both states; there's no
     disabled state here, unlike a permanent log correction (that's
     what Undo is for). Wash instead of a solid fill, and a small
     status line under the original label instead of replacing it —
     with several buttons done, you still need to read the original
     name to pick the right one to un-tap. */
  .ck-item.done{background:rgba(58,168,95,.5);border-color:rgba(58,168,95,.75)}
  .ck-item.done:active{background:rgba(58,168,95,.65)}
  .ck-item .status{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
                    color:#c9f2d6;margin-top:3px}

  /* pinned roles + command — 307.3.2(a)1 makes the IC directly
     responsible for these rather than accounting for them through a
     division, so they sit above the board, not inside it */
  .rolesrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .rolechip{flex:1;min-width:104px;background:var(--panel);border:1px solid var(--line);
            border-radius:10px;padding:9px 11px;text-align:left;color:var(--txt);
            font-family:inherit;cursor:pointer;min-height:48px}
  .rolechip:active{background:var(--panel2)}
  .rolechip .rl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;
                color:var(--faint);font-weight:700;display:block}
  .rolechip .rv{font-size:14.5px;font-weight:700;margin-top:2px;display:block;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rolechip.set{border-color:var(--green)}
  .rolechip.set .rv{color:var(--green)}

  /* board */
  .poshead{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);
           font-weight:700;margin:14px 0 6px}
  .poshead:first-child{margin-top:0}
  .unitrow{display:flex;flex-wrap:wrap;gap:8px}
  .unittile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
            padding:10px 13px;color:var(--txt);font-family:inherit;font-weight:700;
            font-size:14.5px;cursor:pointer;min-height:48px}
  .unittile:active{background:var(--line)}
  .unittile .pc{color:var(--dim);font-weight:600;font-size:13px;margin-left:4px}
  .board-empty{color:var(--faint);font-size:14px}

  /* stepper (personnel count) */
  .stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px 0}
  .stepper button{width:48px;padding:0;font-size:22px;line-height:1}
  .stepper .sv{font-size:26px;font-weight:800;min-width:38px;text-align:center;
               font-variant-numeric:tabular-nums}

  /* resources — two equal columns, one row, each its own box (no
     shared card and no heading — cut in Phase 8 drill feedback) */
  #resources{display:flex;gap:10px;margin-top:22px}
  .rescol{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
          border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center}
  .rescol .rn{font-size:14.5px;font-weight:700;margin-bottom:8px;text-align:center}
  .restoggles{display:flex;gap:7px;width:100%}
  .restoggles button{flex:1;padding:9px 8px;font-size:12.5px;min-height:40px}
  .restoggles button.on{background:var(--green);border-color:var(--green);color:#08130c}

  /* bottom sheet */
  /* display:flex only applies while NOT hidden — a bare .sheet-backdrop{display:flex}
     rule would win over the browser's default [hidden]{display:none} (author
     stylesheet beats UA stylesheet at equal specificity), leaving the backdrop
     visibly covering the screen after "closing" it. */
  .sheet-backdrop:not([hidden]){position:fixed;inset:0;background:rgba(0,0,0,.55);
                  z-index:30;display:flex;align-items:flex-end;justify-content:center}
  /* Phone/tablet portrait: a sheet off the bottom edge, within one-handed
     reach — the posture this whole module is designed around. 88vh so a
     long list (the 21-item assign sheet) shows as much as possible
     without the header scrolling away. */
  .sheet{width:100%;max-height:88vh;background:var(--panel);border-radius:16px 16px 0 0;
         border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column}
  /* Wider screens: centre it as a card instead of a full-width bar welded
     to the bottom edge, which puts the options miles from where the eye
     already is. */
  @media (min-width:700px){
    .sheet-backdrop:not([hidden]){align-items:center}
    .sheet{max-width:560px;max-height:82vh;border-radius:16px;
           border-bottom:1px solid var(--line)}
  }
  .sheet-hd{display:flex;align-items:center;justify-content:space-between;
            padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
  .sheet-hd button{background:none;border:0;color:var(--dim);font-size:20px;
                    min-height:auto;padding:0 4px}
  .sheet-body{overflow-y:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px)}
  .sheet-group{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);
              font-weight:700;margin:14px 0 6px}
  .sheet-group:first-child{margin-top:2px}
  .sheet-opt{display:block;width:100%;text-align:left;background:var(--panel2);
             border:1px solid var(--line);border-radius:10px;padding:13px 14px;
             margin-bottom:7px;color:var(--txt);font-family:inherit;font-size:15px;
             font-weight:600;cursor:pointer;min-height:48px}
  .sheet-opt:active{background:var(--line)}
  .sheet-opt.grey{opacity:.4;pointer-events:none}
  .sheet-opt.destructive{color:var(--red)}
  .sheet-opt.suggested{border-color:var(--amber);background:#2c2410;color:#f0d798}

  .noterow{display:flex;gap:9px}
  .noterow input{flex:1}

  /* timeline */
  ul.tl{list-style:none;margin:0;padding:0}
  ul.tl li{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
  ul.tl li:last-child{border-bottom:0}
  ul.tl .tm{color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
  ul.tl .tx{color:var(--txt)}
  .empty{color:var(--faint);font-size:14px;padding:6px 2px}

  .flag{display:flex;gap:9px;align-items:flex-start;background:#2c2410;border:1px solid #4a3d18;
        border-radius:10px;padding:10px 12px;margin-top:14px;font-size:13.5px;color:#e5c375}
  .flag b{color:#f0d798}

  .tlhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  /* Visually compact (small font, tight padding) but still a real
     48px tap target — Undo is a genuine corrective action a stressed
     IC needs reliably, unlike the info button above. */
  .undo{padding:6px 14px;min-height:48px;font-size:13px;background:var(--panel2)}
  .undo-caption{font-size:12px;color:var(--faint);margin:2px 0 9px}
  .undo-caption:empty{margin:0}

  footer{margin-top:30px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6}
</style>
</head>
<body>
<script>
// Plays on every arrival here — the only entry points are the header's
// Command button (already mid-flip-out on index.html) or the Back link
// below (same treatment in reverse). See the matching script in index.html.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.body.classList.add('flip-in');
  // Timer backstop in case animationend never fires — see index.html's
  // matching script for why this can't rely on the event alone.
  let cleaned = false;
  const clean = () => { if (cleaned) return; cleaned = true; document.body.classList.remove('flip-in'); };
  document.body.addEventListener('animationend', function once(e){
    if (e.animationName === 'pflipIn') { document.body.removeEventListener('animationend', once); clean(); }
  });
  setTimeout(clean, 400);
}
</script>

<div class="bar"><div class="bar-in">
  <a href="index.html" id="btn-back">‹ Back</a>
  <div class="occ" id="hdr-occ">—</div>
  <div class="elapsed">Elapsed Time: <span id="hdr-elapsed">00:00:00</span></div>
  <button type="button" id="btn-par-timer" class="par-timer" aria-label="PAR timer">PAR: —</button>
  <button type="button" id="btn-faq" class="infobtn" aria-label="About this tool">i</button>
</div></div>

<div class="wrap">

  <div id="start-screen" hidden>
    <div id="load-notice"></div>
    <div class="flag">
      <span>▲</span>
      <span><b>Unofficial.</b> A scratchpad for the IC's own device — not a department
      system of record. Nothing here is shared or synced.</span>
    </div>

    <h2>Start Incident</h2>
    <div class="card">
      <div class="field">
        <label for="f-occ">Occupancy</label>
        <select id="f-occ">
          <option value="single-family">Single Family</option>
          <option value="multi-family">Multi-Family</option>
          <option value="commercial">Commercial / Big-Box</option>
          <option value="strip-mall">Strip Mall</option>
          <option value="high-rise">High Rise</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="f-addr">Address <span style="text-transform:none;font-weight:400">(optional)</span></label>
        <input type="text" id="f-addr" placeholder="1420 Main St" autocomplete="off">
      </div>
      <div class="btnrow">
        <button class="primary" id="btn-start">Start Incident</button>
      </div>
    </div>
  </div>

  <div id="active-screen" hidden>
    <div id="save-warning"></div>

    <div class="rolesrow" id="topchips-row"></div>

    <div class="par-row">
      <div id="par-banner"></div>
      <div id="par-suggestion"></div>
    </div>

    <h2>Next Considerations</h2>
    <div class="card">
      <div class="ck" id="checklist"></div>
    </div>

    <h2>Units</h2>
    <div class="card">
      <div id="board"></div>
      <div class="btnrow">
        <button class="primary" id="btn-add-unit">+ Unit</button>
      </div>
    </div>

    <div id="resources"></div>

    <h2>Note</h2>
    <div class="card">
      <div class="noterow">
        <input type="text" id="f-note" placeholder="What happened" autocomplete="off">
        <button id="btn-note">Add</button>
      </div>
    </div>

    <div class="tlhead">
      <h2 style="margin:22px 0 0">Timeline</h2>
      <button type="button" id="btn-undo" class="undo" hidden>Undo</button>
    </div>
    <div id="undo-caption" class="undo-caption"></div>
    <div class="card">
      <ul class="tl" id="timeline"></ul>
    </div>

    <h2>Export</h2>
    <div class="card">
      <textarea id="export-text" readonly rows="8"></textarea>
      <div class="btnrow">
        <button id="btn-copy">Copy</button>
        <button id="btn-share" hidden>Share</button>
      </div>
      <div id="export-status" class="export-status"></div>
    </div>

    <div class="btnrow">
      <button class="danger" id="btn-end">End Incident</button>
    </div>
  </div>

  <footer>Reference tool only. Not a department system of record.</footer>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-hd">
      <span id="sheet-title">—</span>
      <button type="button" id="sheet-close" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<script src="roster.js"></script>
<script src="benchmarks.js"></script>
<script src="suggestions.js"></script>
<script src="command.js"></script>
</body>
</html>
