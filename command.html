<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Command</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --txt:#e8edf3; --dim:#93a1b1; --faint:#5d6b7a;
    --red:#e0362c; --amber:#e0a52c; --green:#3aa85f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  .bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
       padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
  .bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .bar a{color:var(--dim);text-decoration:none;font-size:14px}
  .bar h1{font-size:16px;font-weight:700;margin:0}

  h2{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
     margin:22px 0 9px;font-weight:700}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card + .card{margin-top:10px}

  label{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;
        color:var(--faint);font-weight:700;margin:0 0 7px}
  .field + .field{margin-top:16px}

  select, input[type=text]{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px 13px;font-size:15.5px;font-family:inherit;
    min-height:48px;-webkit-appearance:none;appearance:none;
  }
  select{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%2393a1b1"><path d="M5 7l5 6 5-6z"/></svg>');
    background-repeat:no-repeat;background-position:right 13px center;padding-right:36px;
  }

  button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
         border-radius:10px;padding:13px 18px;font-size:15.5px;font-weight:700;
         font-family:inherit;cursor:pointer;min-height:48px}
  button:active{background:var(--line)}
  .primary{background:var(--green);border-color:var(--green);color:#08130c;width:100%}
  .danger{background:transparent;border-color:var(--red);color:var(--red)}
  .btnrow{display:flex;gap:9px;margin-top:14px}
  .btnrow button{flex:1}

  /* active incident header */
  .inc-hdr{border-left:4px solid var(--green)}
  .inc-hdr .occ{font-size:11px;letter-spacing:.8px;text-transform:uppercase;
                color:var(--faint);font-weight:700}
  .inc-hdr .addr{font-size:19px;font-weight:800;margin:3px 0 2px}
  .inc-hdr .since{font-size:13px;color:var(--dim)}

  /* clocks — always derived from stored timestamps, never a counter;
     see the correctness rule in COMMAND-MODULE-PLAN.md */
  .clocks{display:flex;gap:20px;margin-top:14px}
  .clock{flex:1}
  .clabel{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
          color:var(--faint);font-weight:700}
  .cval{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .cval.overdue{color:var(--red)}

  .parrow{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .parrow .cval{font-size:22px}
  #btn-par{padding:15px 30px;background:var(--panel2)}
  #btn-par:active{background:var(--line)}

  .flag.urgent{background:#2c1414;border-color:#5c2020;color:#f0a8a0}
  .flag.urgent b{color:#fff}
  #par-banner:empty{margin:0}

  .noterow{display:flex;gap:9px}
  .noterow input{flex:1}

  /* timeline */
  ul.tl{list-style:none;margin:0;padding:0}
  ul.tl li{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
  ul.tl li:last-child{border-bottom:0}
  ul.tl .tm{color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
  ul.tl .tx{color:var(--txt)}
  .empty{color:var(--faint);font-size:14px;padding:6px 2px}

  .flag{display:flex;gap:9px;align-items:flex-start;background:#2c2410;border:1px solid #4a3d18;
        border-radius:10px;padding:10px 12px;margin-top:14px;font-size:13.5px;color:#e5c375}
  .flag b{color:#f0d798}

  footer{margin-top:30px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <a href="index.html">‹ Back</a>
  <h1>Command</h1>
</div></div>

<div class="wrap">

  <div id="start-screen" hidden>
    <div class="flag">
      <span>▲</span>
      <span><b>Unofficial.</b> A scratchpad for the IC's own device — not a department
      system of record. Nothing here is shared or synced.</span>
    </div>

    <h2>Start Incident</h2>
    <div class="card">
      <div class="field">
        <label for="f-occ">Occupancy</label>
        <select id="f-occ">
          <option value="single-family">Single Family</option>
          <option value="multi-family">Multi-Family</option>
          <option value="commercial">Commercial / Big-Box</option>
          <option value="strip-mall">Strip Mall</option>
          <option value="high-rise">High Rise</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="f-addr">Address <span style="text-transform:none;font-weight:400">(optional)</span></label>
        <input type="text" id="f-addr" placeholder="1420 Main St" autocomplete="off">
      </div>
      <div class="btnrow">
        <button class="primary" id="btn-start">Start Incident</button>
      </div>
    </div>
  </div>

  <div id="active-screen" hidden>
    <div class="card inc-hdr">
      <div class="occ" id="a-occ">—</div>
      <div class="addr" id="a-addr">—</div>
      <div class="since" id="a-since">—</div>
    </div>

    <h2>Note</h2>
    <div class="card">
      <div class="noterow">
        <input type="text" id="f-note" placeholder="What happened" autocomplete="off">
        <button id="btn-note">Add</button>
      </div>
    </div>

    <h2>Timeline</h2>
    <div class="card">
      <ul class="tl" id="timeline"></ul>
    </div>

    <div class="btnrow">
      <button class="danger" id="btn-end">End Incident</button>
    </div>
  </div>

  <footer>Reference tool only. Not a department system of record.</footer>
</div>

<script src="command.js"></script>
</body>
</html>
